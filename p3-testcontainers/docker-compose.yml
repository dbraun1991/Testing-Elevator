services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB:       keyservice
      POSTGRES_USER:     keyservice
      POSTGRES_PASSWORD: keyservice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyservice"]
      interval: 5s
      timeout: 5s
      retries: 5

  keyservice:
    image: keyservice:latest
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/keyservice
      SPRING_DATASOURCE_USERNAME: keyservice
      SPRING_DATASOURCE_PASSWORD: keyservice
    depends_on:
      postgres:
        condition: service_healthy
        