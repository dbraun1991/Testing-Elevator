server.port=8081

# DataSource — overridable via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/keyservice}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:keyservice}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:VerylongKeyserviceDatabasepassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
